name: release-please

# Reusable workflow: release-please in manifest mode for the caller's repository (delivery model 2 of
# Bruno's engineering playbook: a release pull request; merging it makes the vX.Y.Z tag and the GitHub
# release). It runs as the caller's own release GitHub App (one app per repository, installed on that
# repository alone), not GITHUB_TOKEN, for two reasons:
# - a pull request opened with GITHUB_TOKEN starts no workflow, so the release pull request would
#   never get its required checks;
# - when release-please makes the tag (skip-github-release false), the v* tag ruleset lets only that
#   app create it; with skip-github-release the caller's own release workflow makes the tag.
# The app token is limited to the caller's repository and to contents, pull requests and issues
# (labels). Call it on a push to main only.
#
# Caller:
#   on:
#     push:
#       branches: [main]
#   permissions: {}
#   jobs:
#     release-please:
#       uses: brunosouzas/github-reusable-workflows/.github/workflows/release-please.yml@vX.Y.Z
#       secrets:
#         RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
#
# Needs in the caller: release-please-config.json and .release-please-manifest.json; its release app
# installed on the repository; the environment `release-please` (deployment branch main only, no
# reviewer) with the variable RELEASE_APP_CLIENT_ID and the secret RELEASE_APP_PRIVATE_KEY (the app's
# private key, PEM). The job declares that environment, so both resolve to the environment's values and
# only a run on main can read the key: the variable is read here directly, and the caller still passes
# the secret by name (GitHub resolves a secret a caller passes by name from the environment of the job
# that uses it, even when it exists only there). The secret is declared optional on purpose: whether
# it is not passed or resolves empty, the first step stops with an error that names it. The app is the bypass of the repository's v* tag ruleset when release-please
# makes the tag.
#
# Actions are pinned by commit SHA, with the tag in a comment.

on:
  workflow_call:
    inputs:
      environment:
        description: The caller's environment that holds the app's key (deployment branch main only)
        type: string
        default: release-please
      skip-github-release:
        description: Open the release pull request only; something else creates the tag and the release
        type: boolean
        default: false
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: Pass it by name; it resolves from the environment (the app's private key, PEM)
        required: false
    outputs:
      releases_created:
        description: "\"true\" when this run created a release"
        value: ${{ jobs.release-please.outputs.releases_created }}
      tag_name:
        description: The tag of the release this run created
        value: ${{ jobs.release-please.outputs.tag_name }}
      pr:
        description: The release pull request this run opened or updated (JSON)
        value: ${{ jobs.release-please.outputs.pr }}

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    permissions: {}
    concurrency:
      group: release-please-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: The environment holds the app's Client ID and key
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          KEY_SET: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          [ -n "$CLIENT_ID" ] || { echo "::error::RELEASE_APP_CLIENT_ID is empty: set it in the environment $ENV_NAME"; exit 1; }
          [ "$KEY_SET" = true ] || { echo "::error::RELEASE_APP_PRIVATE_KEY is empty: set it in the environment $ENV_NAME and pass it by name from the caller"; exit 1; }
      - name: App token for this repository only
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      # With skip-github-release, the caller's own release workflow makes the tag, so release-please
      # never labels the merged release pull request "autorelease: tagged"; it stays "pending" and
      # every later run stops at "untagged, merged release PRs outstanding". Mark the ones whose
      # v<version> tag exists. A run on the merge itself may come before the tag: the next push fixes it.
      - name: Mark released pull requests as tagged (skip-github-release)
        if: inputs.skip-github-release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create "autorelease: tagged" -R "$REPO" --color ededed --force >/dev/null
          gh pr list -R "$REPO" --state merged --label "autorelease: pending" --limit 20 \
            --json number,title --jq '.[] | "\(.number)\t\(.title)"' |
            while IFS=$'\t' read -r number title; do
              version=$(printf '%s\n' "$title" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.-]+)?' | tail -n 1 || true)
              [ -n "$version" ] || continue
              if gh api "repos/$REPO/git/ref/tags/v$version" >/dev/null 2>&1; then
                # Labels through REST: gh pr edit (GraphQL) can fail with a narrowly scoped app token.
                gh api -X DELETE "repos/$REPO/issues/$number/labels/autorelease:%20pending" >/dev/null
                gh api "repos/$REPO/issues/$number/labels" -f "labels[]=autorelease: tagged" >/dev/null
                echo "#$number: v$version exists, marked tagged"
              else
                echo "#$number: v$version not tagged yet"
              fi
            done
      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: ${{ inputs.skip-github-release }}
